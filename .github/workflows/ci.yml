name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android 构建与单元测试
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 直接用 runner 自带的 SDK（setup-android 会执行已下线的 sdkmanager tools）
      - name: 接受 SDK 许可
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true; fi
          chmod +x gradlew

      - name: 单元测试
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain

      - name: 构建未签名 APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk

  server:
    name: 电脑端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: python -m pip install -r server/requirements.txt

      - name: 运行测试
        working-directory: server
        run: python -m unittest discover -s tests -v
